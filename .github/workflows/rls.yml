name: Database permission tests

on:
  push:
    paths:
      - 'supabase/**'
      - '.github/workflows/rls.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/rls.yml'

permissions:
  contents: read

jobs:
  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: supabase/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: supabase/tests/package-lock.json
      - run: npm ci
      - run: npm test
